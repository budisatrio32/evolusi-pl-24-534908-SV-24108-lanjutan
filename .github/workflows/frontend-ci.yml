name: Frontend CI/CD

on:
  push:
    branches: ['**']          # semua branch → lint, test, build tetap jalan
  pull_request:
    branches: [main, dev]

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa gaya kode (oxlint + ESLint)
        run: npm run lint

  test:
    name: Frontend Unit Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Jalankan unit test (Vitest)
        run: npm run test:unit -- --run

  build:
    name: Frontend Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependensi
        run: npm ci

      - name: Build aplikasi Vue
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.contoh.test/api' }}

      - name: Unggah hasil build sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Frontend Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # penjaga: hanya dari main
    runs-on: ubuntu-latest
    steps:
      - name: Ambil hasil build dari job build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Tampilkan isi dist/
        run: |
          echo "Isi folder dist/ hasil job build (tanpa build ulang):"
          ls -la dist/
          echo "---"
          find dist -type f | sort

      - name: Langkah deploy (simulasi)
        run: echo "Unggah isi dist/ ke hosting statis untuk commit ${{ github.sha }}"
